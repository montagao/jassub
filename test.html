<!DOCTYPE html>
<html>
<head>
  <title>JASSUB Test</title>
  <style>
    video, canvas {
      width: 640px;
      height: 360px;
    }
  </style>
</head>
<body>
  <video id="video" controls crossorigin="anonymous">
    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
  </video>
  
  <script src="roundedass.js"></script>
  
  <script type="module">
    import JASSUB from './jassub.es.js';

    const video = document.getElementById('video');
    const SUB_URL = 'https://raw.githubusercontent.com/arcusmaximus/YTSubConverter/38fb2ab469f37e8f3a5a6a27adf91d9d0e81ea4f/sample2.ass';
    let renderer;
    let roundedAss;

    // Function to fetch and process subtitle file
    async function loadSubtitles() {
      try {
        // Initialize JASSUB first
        renderer = new JASSUB({
          video: video,
          subUrl: SUB_URL,
          debug: true
        });

        // Wait for JASSUB to be ready
        await new Promise((resolve, reject) => {
          renderer.addEventListener('ready', resolve);
          renderer.addEventListener('error', reject);
        });

        console.log('JASSUB is ready');

        // Initialize RoundedASS with JASSUB instance
        roundedAss = new RoundedASS({
          bgAlpha: 160,
          borderRadius: 15,
          paddingH: 25,
          paddingV: 15
        });
        await roundedAss.setJassub(renderer);

        // Fetch the subtitle content
        const response = await fetch(SUB_URL);
        const originalContent = await response.text();

        // Process the subtitles
        const processedContent = await roundedAss.processAss(originalContent);

        // Load the processed subtitles back into JASSUB
        await renderer.setTrack(processedContent);

        // Play the video
        video.play();
      } catch (error) {
        console.error('Error loading subtitles:', error);
      }
    }

    // Load subtitles when the page loads
    loadSubtitles();

    // Cleanup on page unload
    window.addEventListener('unload', () => {
      if (roundedAss) roundedAss.dispose();
      if (renderer) renderer.dispose();
    });
  </script>
</body>
</html>
